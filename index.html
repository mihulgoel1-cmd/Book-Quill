<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Book & Quill</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Merriweather:ital,wght@0,400;0,700;1,400&family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=Caveat:wght@400;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root, [data-theme="light"] {
    --bg: #F4F6F9; --paper: #FFFFFF; --ink: #1E293B; --ink-soft: #475569; --muted: #64748B;
    --accent: #F08B6F; --accent-hover: #E07A5F; --danger: #EF4444; --danger-bg: #FEE2E2;
    --border: #E2E8F0; --sidebar: #F8FAFC; --modal-bg: rgba(15,23,42,.4);
    --shadow-sm: 0 1px 3px rgba(0,0,0,.05); --shadow-md: 0 10px 25px -5px rgba(0,0,0,.05); --shadow-lg: 0 20px 40px -10px rgba(0,0,0,.1);
  }
  [data-theme="dark"] {
    --bg: #1A181D; --paper: #201D24; --ink: #F0EAF5; --ink-soft: #D2CADB; --muted: #90879B;
    --accent: #F08B6F; --accent-hover: #FFA68E; --danger: #F26B6B; --danger-bg: #382020;
    --border: #3B3645; --sidebar: #18161B; --modal-bg: rgba(0,0,0,.6);
    --shadow-sm: 0 1px 3px rgba(0,0,0,.3); --shadow-md: 0 10px 25px -5px rgba(0,0,0,.4); --shadow-lg: 0 20px 40px -10px rgba(0,0,0,.6);
  }
  
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { 
    background: var(--bg); font-family: 'Inter', sans-serif; color: var(--ink); 
    display: flex; align-items: center; justify-content: center; 
    min-height: 100vh; padding: 24px; transition: background 0.3s, color 0.3s;
  }

  /* MODAL */
  .modal-overlay{position:fixed;inset:0;z-index:3000;background:var(--modal-bg);display:flex;align-items:center;justify-content:center;opacity:0;animation:modalFade .15s ease forwards;backdrop-filter:blur(4px);}
  @keyframes modalFade{to{opacity:1}}
  .modal{background:var(--paper);border:1px solid var(--border);border-radius:12px;box-shadow:var(--shadow-lg);width:420px;max-width:90%;padding:28px;transform:translateY(10px);animation:modalRise .15s ease forwards;}
  @keyframes modalRise{to{transform:translateY(0)}}
  .modal h3{font-family:'Merriweather',serif;font-size:1.4rem;margin-bottom:8px;}
  .modal p{color:var(--muted);font-size:0.9rem;margin-bottom:20px;line-height:1.5;}
  .modal input{width:100%;padding:12px;border-radius:8px;border:1px solid var(--border);background:var(--bg);color:var(--ink);font-size:1rem;outline:none;margin-bottom:24px;}
  .modal-actions{display:flex;justify-content:flex-end;gap:10px;}
  .btn-modal{padding:10px 18px;border-radius:8px;border:1px solid transparent;cursor:pointer;font-weight:500;font-size:0.9rem;}
  .btn-modal.cancel{background:transparent;color:var(--muted);border-color:var(--border);}
  .btn-modal.cancel:hover{background:var(--sidebar);}
  .btn-modal.ok{background:var(--accent);color:white;}
  .btn-modal.ok:hover{background:var(--accent-hover);}
  .btn-modal.danger{background:var(--danger);color:white;}
  .btn-modal.danger:hover{background:#DC2626;}

  /* LOGIN SCREEN */
  #auth-screen { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: var(--bg); z-index: 1000; }
  .auth-card { background: var(--paper); width: 400px; max-width: 100%; padding: 40px; border-radius: 16px; box-shadow: var(--shadow-lg); border: 1px solid var(--border); }
  .auth-card h1 { font-family: 'Merriweather', serif; font-size: 2rem; margin-bottom: 8px; text-align: center; }
  .auth-card p { color: var(--muted); text-align: center; margin-bottom: 24px; font-size: 0.95rem; }
  .auth-card input { width: 100%; padding: 12px; margin-bottom: 16px; border-radius: 8px; border: 1px solid var(--border); font-size: 1rem; outline: none; background: var(--bg); color: var(--ink); }
  .auth-card input:focus { border-color: var(--accent); }
  .auth-card button { width: 100%; padding: 12px; background: var(--accent); color: white; border: none; border-radius: 8px; font-size: 1rem; font-weight: 600; cursor: pointer; transition: 0.2s; }
  .auth-card button:hover { background: var(--accent-hover); }
  .auth-card button:disabled { opacity: 0.7; cursor: not-allowed; }
  .auth-toggle { text-align: center; margin-top: 16px; font-size: 0.9rem; color: var(--muted); }
  .auth-toggle span { color: var(--accent); cursor: pointer; font-weight: 500; }

  /* APP LAYOUT */
  #app-screen { display: none; width: 1380px; max-width: 100%; height: 94vh; background: var(--paper); border-radius: 16px; box-shadow: var(--shadow-lg); overflow: hidden; flex-direction: column; border: 1px solid var(--border); }
  .topbar { display: flex; justify-content: space-between; align-items: center; padding: 12px 24px; border-bottom: 1px solid var(--border); background: var(--paper); }
  .brand { font-family: 'Merriweather', serif; font-size: 1.2rem; font-weight: 700; display: flex; align-items: center; gap: 12px; }
  .user-info { display: flex; align-items: center; gap: 12px; font-size: 0.9rem; color: var(--muted); }
  
  .btn { padding: 8px 16px; border-radius: 8px; border: 1px solid var(--border); background: var(--paper); color: var(--ink); cursor: pointer; font-size: 0.9rem; font-weight: 500; transition: all 0.2s; display: inline-flex; align-items: center; gap: 6px; }
  .btn:hover { background: var(--sidebar); }
  .btn.primary { background: var(--accent); color: white; border-color: var(--accent); }
  .btn.primary:hover { background: var(--accent-hover); }
  .btn.danger { color: var(--danger); border-color: var(--danger); background: var(--paper); }
  .btn.danger:hover { background: var(--danger-bg); }
  .btn.icon { padding: 8px; }
  
  /* LIBRARY */
  .library { padding: 40px; overflow-y: auto; flex: 1; }
  .tabs { display: flex; gap: 24px; margin-bottom: 24px; border-bottom: 1px solid var(--border); }
  .tab { padding: 12px 0; font-size: 1.1rem; font-weight: 500; color: var(--muted); cursor: pointer; border-bottom: 2px solid transparent; }
  .tab.active { color: var(--accent); border-bottom-color: var(--accent); }
  .book-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 24px; }
  .book-card { background: var(--paper); border: 1px solid var(--border); border-radius: 12px; padding: 24px; cursor: pointer; transition: transform 0.2s, box-shadow 0.2s; display: flex; flex-direction: column; position: relative; }
  .book-card:hover { transform: translateY(-2px); box-shadow: var(--shadow-md); border-color: var(--accent); }
  .book-card h3 { font-family: 'Merriweather', serif; font-size: 1.3rem; margin-bottom: 8px; padding-right: 30px; }
  .book-card .author { font-size: 0.85rem; color: var(--muted); margin-bottom: 16px; }
  .book-card .meta { font-size: 0.8rem; color: var(--muted); margin-top: auto; }
  .book-card .edit-btn { position: absolute; top: 20px; right: 20px; opacity: 0; transition: opacity 0.2s; }
  .book-card:hover .edit-btn { opacity: 1; }
  .empty { text-align: center; color: var(--muted); padding: 60px 20px; font-style: italic; }

  /* EDITOR */
  #editor-screen { display: none; flex: 1; flex-direction: row; overflow: hidden; position: relative; }
  .sidebar { width: 300px; background: var(--sidebar); border-right: 1px solid var(--border); display: flex; flex-direction: column; transition: margin-left 0.3s; flex-shrink: 0; }
  .sidebar.hidden { margin-left: -300px; }
  .search-box { padding: 16px; border-bottom: 1px solid var(--border); }
  .search-box input { width: 100%; padding: 8px 12px; border-radius: 6px; border: 1px solid var(--border); background: var(--paper); color: var(--ink); outline: none; }
  .chapter-list { flex: 1; overflow-y: auto; padding: 12px; }
  .chapter-item { padding: 10px 12px; border-radius: 8px; cursor: pointer; font-size: 0.9rem; margin-bottom: 4px; }
  .chapter-item:hover { background: var(--border); }
  .chapter-item.active { background: var(--accent); color: white; }
  .sidebar-footer { padding: 16px; border-top: 1px solid var(--border); display: flex; flex-direction: column; gap: 8px; }

  .main-editor { flex: 1; display: flex; flex-direction: column; background: var(--bg); overflow: hidden; min-width: 0; }
  .toolbar { display: flex; gap: 4px; padding: 8px 24px; border-bottom: 1px solid var(--border); background: var(--paper); flex-wrap: wrap; align-items: center; min-height: 50px; }
  .tbtn { background: none; border: none; padding: 6px 10px; border-radius: 6px; cursor: pointer; color: var(--ink-soft); font-size: 0.9rem; font-weight: 500; display: flex; align-items: center; justify-content: center; transition: background 0.2s; }
  .tbtn:hover { background: var(--sidebar); }
  .tbtn svg { width: 16px; height: 16px; }
  .tselect { padding: 6px; border-radius: 6px; border: 1px solid var(--border); background: var(--paper); color: var(--ink); font-size: 0.9rem; outline: none; margin-right: 8px; cursor: pointer;}
  
  .editor-header { background: var(--paper); padding: 16px 24px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; gap: 16px;}
  .editor-header input { font-family: 'Merriweather', serif; font-size: 1.8rem; border: none; outline: none; font-weight: 600; background: transparent; color: var(--ink); width: 100%; }
  .save-status { font-size: 0.8rem; color: var(--muted); white-space: nowrap; }
  
  .paper-container { flex: 1; overflow-y: auto; padding: 40px 0 100px; display: flex; justify-content: center; }
  .paper { width: 100%; max-width: 780px; background: var(--paper); border-radius: 8px; padding: 70px 80px; box-shadow: var(--shadow-sm); border: 1px solid var(--border); min-height: 800px; transition: max-width 0.3s; }
  .editor-content { font-family: 'Merriweather', serif; font-size: 1.1rem; line-height: 1.9; outline: none; color: var(--ink); }
  .editor-content h1 { font-size: 2rem; margin-bottom: 1rem; }
  .editor-content p { margin-bottom: 1rem; }
  .editor-content blockquote { border-left: 3px solid var(--accent); padding-left: 16px; color: var(--muted); font-style: italic; margin-bottom: 1rem; }
  .theme-btn { background: none; border: none; cursor: pointer; color: var(--ink); padding: 8px; display: flex; align-items: center; justify-content: center; }
</style>
</head>
<body data-theme="light">

<div id="modal-container"></div>

<!-- LOGIN SCREEN -->
<div id="auth-screen">
  <div class="auth-card">
    <h1>Book & Quill</h1>
    <p id="auth-sub">Sign in to your account</p>
    <input type="email" id="auth-email" placeholder="Email address">
    <input type="password" id="auth-pass" placeholder="Password">
    <button id="auth-btn">Sign In</button>
    <div class="auth-toggle">
      <span id="auth-switch">Need an account? Sign up</span>
    </div>
  </div>
</div>

<!-- MAIN APP -->
<div id="app-screen">
  <div class="topbar" id="main-topbar">
    <div class="brand">Book & Quill</div>
    <div class="user-info" id="topbar-controls"></div>
  </div>
  <div class="library" id="library-screen"></div>
  <div id="editor-screen"></div>
</div>

<script>
// ==========================================
// 1. SETUP & UTILS
// ==========================================
const SUPABASE_URL = 'https://gaslgwygpqrtoxvzotsu.supabase.co'.trim();
const SUPABASE_KEY = 'sb_publishable_IDdZy1d0hQGT0G9U1ibldw_rHI4D60G'.trim();
const { createClient } = supabase;
const db = createClient(SUPABASE_URL, SUPABASE_KEY);

let currentUser = null;
let isLoginMode = true;
let currentTab = 'private';
let activeBook = null;
let activeChapterId = null;
let isReadOnly = false;
let saveTimer = null;
let sidebarHidden = false;

// Custom Modal
function showModal({ title, desc, inputVal, okText, isDanger, onOk }) {
  const container = document.getElementById('modal-container');
  container.innerHTML = `
    <div class="modal-overlay" id="modalOverlay">
      <div class="modal">
        <h3>${title}</h3>
        ${desc ? `<p>${desc}</p>` : ''}
        ${inputVal !== undefined ? `<input type="text" id="modalInput" value="${inputVal}">` : ''}
        <div class="modal-actions">
          <button class="btn-modal cancel" id="modalCancel">Cancel</button>
          <button class="btn-modal ${isDanger ? 'danger' : 'ok'}" id="modalOk">${okText || 'OK'}</button>
        </div>
      </div>
    </div>`;
  
  const input = document.getElementById('modalInput');
  if (input) setTimeout(() => { input.focus(); input.select(); }, 50);
  
  const close = () => container.innerHTML = '';
  const confirm = () => {
    const val = input ? input.value : null;
    if (onOk && onOk(val) === false) return;
    close();
  };

  document.getElementById('modalCancel').onclick = close;
  document.getElementById('modalOk').onclick = confirm;
  
  container.querySelector('.modal').addEventListener('keydown', (e) => {
    if(e.key === 'Enter') { e.preventDefault(); e.stopPropagation(); confirm(); }
    if(e.key === 'Escape') { e.preventDefault(); close(); }
  });
}

// Theme
function toggleTheme() {
  const current = document.body.getAttribute('data-theme');
  const next = current === 'light' ? 'dark' : 'light';
  document.body.setAttribute('data-theme', next);
  localStorage.setItem('theme', next);
  updateThemeIcon(next);
}
function updateThemeIcon(theme) {
  const icon = document.getElementById('theme-icon');
  if(!icon) return;
  if(theme === 'dark') icon.innerHTML = '<path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>';
  else icon.innerHTML = '<circle cx="12" cy="12" r="5"/><path d="M12 1v2m0 18v2M4.22 4.22l1.42 1.42m12.72 12.72l1.42 1.42M1 12h2m18 0h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/>';
}
const savedTheme = localStorage.getItem('theme') || 'light';
document.body.setAttribute('data-theme', savedTheme);
updateThemeIcon(savedTheme);

// ==========================================
// 2. AUTHENTICATION
// ==========================================
const authBtn = document.getElementById('auth-btn');
const authSwitch = document.getElementById('auth-switch');
const authPass = document.getElementById('auth-pass');

authSwitch.addEventListener('click', () => {
  isLoginMode = !isLoginMode;
  document.getElementById('auth-sub').textContent = isLoginMode ? 'Sign in to your account' : 'Create a new account';
  authBtn.textContent = isLoginMode ? 'Sign In' : 'Sign Up';
  authSwitch.textContent = isLoginMode ? 'Need an account? Sign up' : 'Already have an account? Sign in';
});

async function handleAuth() {
  const email = document.getElementById('auth-email').value.trim();
  const password = authPass.value;
  if(!email || !password) return showModal({title: 'Error', desc: 'Please enter email and password', okText: 'OK'});
  
  authBtn.textContent = 'Please wait...'; 
  authBtn.disabled = true;

  try {
    if (isLoginMode) {
      const { error } = await db.auth.signInWithPassword({ email, password });
      if (error) throw error;
    } else {
      const { error } = await db.auth.signUp({ email, password });
      if (error) throw error;
      showModal({title: 'Success', desc: 'Account created! You can now log in.', okText: 'OK'});
      isLoginMode = true;
      authBtn.textContent = 'Sign In';
      authSwitch.textContent = 'Need an account? Sign up';
      document.getElementById('auth-sub').textContent = 'Sign in to your account';
    }
  } catch (err) {
    showModal({title: 'Authentication Error', desc: err.message, okText: 'Try Again'});
  } finally {
    if(isLoginMode) authBtn.textContent = 'Sign In';
    authBtn.disabled = false;
  }
}

authBtn.addEventListener('click', handleAuth);
authPass.addEventListener('keydown', (e) => { if(e.key === 'Enter') { e.preventDefault(); handleAuth(); } });

db.auth.onAuthStateChange((event, session) => {
  if (session) {
    currentUser = session.user;
    document.getElementById('auth-screen').style.display = 'none';
    document.getElementById('app-screen').style.display = 'flex';
    showLibrary('private');
  } else {
    currentUser = null;
    document.getElementById('auth-screen').style.display = 'flex';
    document.getElementById('app-screen').style.display = 'none';
  }
});

// ==========================================
// 3. LIBRARY LOGIC
// ==========================================
async function showLibrary(tab) {
  currentTab = tab;
  document.getElementById('library-screen').style.display = 'block';
  document.getElementById('editor-screen').style.display = 'none';
  
  document.getElementById('main-topbar').innerHTML = `
    <div class="brand">Book & Quill</div>
    <div class="user-info" id="topbar-controls">
      <button class="theme-btn" onclick="toggleTheme()" title="Toggle Theme">
        <svg id="theme-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"></svg>
      </button>
      <span>${currentUser.email}</span>
      <button class="btn" id="logoutBtn">Log out</button>
    </div>
  `;
  updateThemeIcon(document.body.getAttribute('data-theme'));
  document.getElementById('logoutBtn').addEventListener('click', () => db.auth.signOut());

  const lib = document.getElementById('library-screen');
  lib.innerHTML = `<div class="empty">Loading...</div>`;

  let query = db.from('books').select('*');
  if (tab === 'private') query = query.eq('user_id', currentUser.id);
  else query = query.eq('is_published', true);

  const { data: books, error } = await query.order('created_at', { ascending: false });
  if (error) return lib.innerHTML = `<div class="empty">Error: ${error.message}</div>`;

  const cards = books.length === 0 ? `<div class="empty">No books found here.</div>` : books.map(b => `
    <div class="book-card" onclick="openBook('${b.id}')">
      ${tab === 'private' ? `<button class="btn icon edit-btn" onclick="renameBook(event, '${b.id}', '${b.title.replace(/'/g, "\\'")}')">✎</button>` : ''}
      <h3>${b.title}</h3>
      <div class="author">${tab === 'public' ? 'By ' + (b.author_email || 'Unknown') : 'Your Book'}</div>
      <div class="meta">${b.chapters.length} chapters</div>
      ${tab === 'private' ? `<button class="btn danger" style="margin-top:12px; align-self:flex-start;" onclick="deleteBook(event, '${b.id}')">Delete</button>` : ''}
    </div>
  `).join('');

  lib.innerHTML = `
    <div class="tabs">
      <div class="tab ${tab==='private'?'active':''}" onclick="showLibrary('private')">My Books</div>
      <div class="tab ${tab==='public'?'active':''}" onclick="showLibrary('public')">Public Library</div>
    </div>
    ${tab === 'private' ? `<button class="btn primary" style="margin-bottom:24px;" onclick="createBook()">+ Create New Book</button>` : ''}
    <div class="book-grid">${cards}</div>
  `;
}

function createBook() {
  showModal({
    title: 'Create New Book', inputVal: 'Untitled Book', okText: 'Create',
    onOk: async (val) => {
      if(!val) return false;
      const { data, error } = await db.from('books').insert({
        user_id: currentUser.id, author_email: currentUser.email,
        title: val, chapters: [{ id: Date.now().toString(), title: 'Chapter 1', contentHTML: '' }],
        is_published: false
      }).select().single();
      if (error) return showModal({title: 'Error', desc: error.message, okText: 'OK'});
      openBook(data.id);
    }
  });
}

function renameBook(e, id, oldTitle) {
  e.stopPropagation();
  showModal({
    title: 'Rename Book', inputVal: oldTitle, okText: 'Save',
    onOk: async (val) => {
      if (!val || val === oldTitle) return;
      await db.from('books').update({ title: val }).eq('id', id);
      showLibrary('private');
    }
  });
}

function deleteBook(e, id) {
  e.stopPropagation();
  showModal({
    title: 'Delete Book', desc: 'Are you sure? This cannot be undone.', okText: 'Delete', isDanger: true,
    onOk: async () => {
      await db.from('books').delete().eq('id', id);
      showLibrary('private');
    }
  });
}

// ==========================================
// 4. EDITOR LOGIC (Strict Permissions)
// ==========================================
async function openBook(id) {
  const { data, error } = await db.from('books').select('*').eq('id', id).single();
  if (error) return showModal({title: 'Error', desc: error.message, okText: 'OK'});
  
  activeBook = data;
  activeChapterId = data.chapters[0]?.id;
  
  // STRICT PERMISSION CHECK
  isReadOnly = activeBook.user_id !== currentUser.id;
  
  document.getElementById('library-screen').style.display = 'none';
  document.getElementById('editor-screen').style.display = 'flex';
  renderEditor();
}

function renderEditor() {
  const ed = document.getElementById('editor-screen');
  const chapters = activeBook.chapters.sort((a,b) => a.position - b.position);
  const ch = chapters.find(c => c.id === activeChapterId);

  document.getElementById('main-topbar').innerHTML = `
    <div class="brand" style="font-size: 1.1rem; color: var(--muted);">📖 ${activeBook.title}</div>
    <div class="user-info" id="topbar-controls">
      <button class="btn icon" onclick="toggleSidebar()" title="Toggle Sidebar">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M9 3v18"/></svg>
      </button>
      <button class="btn icon" onclick="toggleFullscreen()" title="Fullscreen">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"/></svg>
      </button>
      <button class="theme-btn" onclick="toggleTheme()" title="Toggle Theme">
        <svg id="theme-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"></svg>
      </button>
      <button class="btn" id="logoutBtn">Log out</button>
    </div>
  `;
  updateThemeIcon(document.body.getAttribute('data-theme'));
  document.getElementById('logoutBtn').addEventListener('click', () => db.auth.signOut());

  const chapterList = chapters.map((c, i) => `
    <div class="chapter-item ${c.id === activeChapterId ? 'active' : ''}" onclick="selectChapter('${c.id}')">
      <span>${i+1}. ${c.title || 'Untitled'}</span>
    </div>
  `).join('');

  ed.innerHTML = `
    <div class="sidebar ${sidebarHidden ? 'hidden' : ''}" id="sidebar">
      <div style="padding:16px; border-bottom:1px solid var(--border); display:flex; justify-content:space-between;">
        <button class="btn" onclick="showLibrary('${isReadOnly ? 'public' : 'private'}')">← Back</button>
        ${!isReadOnly ? `<button class="btn" onclick="togglePublish()">${activeBook.is_published ? 'Unpublish' : 'Publish'}</button>` : `<span style="font-size:0.8rem; color:var(--muted); padding:8px;">Read Only</span>`}
      </div>
      <div class="search-box">
        <input type="text" placeholder="Search text..." oninput="searchText(this.value)">
      </div>
      <div class="chapter-list" id="chapter-list">${chapterList}</div>
      ${!isReadOnly ? `
      <div class="sidebar-footer">
        <button class="btn" style="width:100%;" onclick="addChapter()">+ Add Chapter</button>
        <div style="display:flex; gap:8px;">
          <button class="btn" style="flex:1;" onclick="exportJSON()">⬇ JSON</button>
          <button class="btn" style="flex:1;" onclick="exportPDF()">⬇ PDF</button>
        </div>
        <label class="btn" style="text-align:center; cursor:pointer;">
          ⬆ Import <input type="file" accept=".json" style="display:none;" onchange="importJSON(event)">
        </label>
      </div>` : ''}
    </div>
    
    <div class="main-editor">
      ${!isReadOnly ? `
      <div class="toolbar">
        <select class="tselect" onchange="execCmd('formatBlock', this.value); this.value='';">
          <option value="p">Body</option>
          <option value="h1">Heading 1</option>
          <option value="h2">Heading 2</option>
          <option value="h3">Heading 3</option>
          <option value="blockquote">Quote</option>
        </select>
        <button class="tbtn" onclick="execCmd('bold')" title="Bold">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M6 4h8a4 4 0 0 1 4 4 4 4 0 0 1-4 4H6z"/><path d="M6 12h9a4 4 0 0 1 4 4 4 4 0 0 1-4 4H6z"/></svg>
        </button>
        <button class="tbtn" onclick="execCmd('italic')" title="Italic">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="19" y1="4" x2="10" y2="4"/><line x1="14" y1="20" x2="5" y2="20"/><line x1="15" y1="4" x2="9" y2="20"/></svg>
        </button>
        <button class="tbtn" onclick="execCmd('underline')" title="Underline">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M6 3v7a6 6 0 0 0 6 6 6 6 0 0 0 6-6V3"/><line x1="4" y1="21" x2="20" y2="21"/></svg>
        </button>
        <div style="width:1px; background:var(--border); margin:0 8px; height:20px;"></div>
        <select class="tselect" onchange="execCmd(this.value); this.value='';">
          <option value="">Lists</option>
          <option value="insertUnorderedList">Bullets</option>
          <option value="insertOrderedList">Numbers</option>
        </select>
        <button class="tbtn" onclick="execCmd('justifyLeft')" title="Align Left">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="17" y1="10" x2="3" y2="10"/><line x1="21" y1="6" x2="3" y2="6"/><line x1="21" y1="14" x2="3" y2="14"/><line x1="17" y1="18" x2="3" y2="18"/></svg>
        </button>
        <button class="tbtn" onclick="execCmd('justifyCenter')" title="Align Center">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="10" x2="6" y2="10"/><line x1="21" y1="6" x2="3" y2="6"/><line x1="21" y1="14" x2="3" y2="14"/><line x1="18" y1="18" x2="6" y2="18"/></svg>
        </button>
        <button class="tbtn" onclick="execCmd('justifyRight')" title="Align Right">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="21" y1="10" x2="7" y2="10"/><line x1="21" y1="6" x2="3" y2="6"/><line x1="21" y1="14" x2="3" y2="14"/><line x1="21" y1="18" x2="7" y2="18"/></svg>
        </button>
        <div style="width:1px; background:var(--border); margin:0 8px; height:20px;"></div>
        <select class="tselect" onchange="changeFont(this.value)">
          <option value="'Merriweather', serif">Merriweather</option>
          <option value="'Playfair Display', serif">Playfair</option>
          <option value="'Courier Prime', monospace">Typewriter</option>
          <option value="'Caveat', cursive">Handwritten</option>
          <option value="'Inter', sans-serif">Sans-Serif</option>
        </select>
      </div>` : '<div style="height:20px; background:var(--paper); border-bottom:1px solid var(--border);"></div>'}
      
      <div class="editor-header">
        <input type="text" value="${ch?.title || ''}" oninput="updateTitle(this.value)" placeholder="Chapter Title" ${isReadOnly ? 'readonly' : ''}>
        <span id="save-status" class="save-status">Saved</span>
      </div>
      <div class="paper-container">
        <div class="paper" id="paper">
          <div class="editor-content" id="editor-body" contenteditable="${!isReadOnly}" oninput="handleInput()">
            ${ch?.contentHTML || ''}
          </div>
        </div>
      </div>
    </div>
  `;
}

function execCmd(cmd, val = null) { 
  if(isReadOnly) return; // EXTRA SAFEGUARD
  const editor = document.getElementById('editor-body');
  if(editor) editor.focus();
  document.execCommand(cmd, false, val); 
}

function changeFont(font) { 
  if(isReadOnly) return;
  const editor = document.getElementById('editor-body');
  if(editor) editor.style.fontFamily = font; 
}

function searchText(val) {
  val = val.toLowerCase();
  document.querySelectorAll('.chapter-item').forEach(item => {
    const chId = item.getAttribute('onclick').match(/'([^']+)'/)[1];
    const chapter = activeBook.chapters.find(c => c.id === chId);
    const textContent = (chapter.contentHTML || '').toLowerCase();
    const title = (chapter.title || '').toLowerCase();
    if(title.includes(val) || textContent.includes(val)) item.style.display = 'block';
    else item.style.display = 'none';
  });
}

function selectChapter(id) { activeChapterId = id; renderEditor(); }

function addChapter() {
  if(isReadOnly) return;
  const newCh = { id: Date.now().toString(), title: `Chapter ${activeBook.chapters.length + 1}`, contentHTML: '' };
  activeBook.chapters.push(newCh);
  activeChapterId = newCh.id;
  saveToCloud().then(() => renderEditor());
}

function togglePublish() {
  if(isReadOnly) return;
  showModal({
    title: activeBook.is_published ? 'Unpublish Book' : 'Publish Book',
    desc: activeBook.is_published ? 'This will remove it from the public library.' : 'This will make it visible to everyone.',
    okText: activeBook.is_published ? 'Unpublish' : 'Publish',
    onOk: async () => {
      const nextState = !activeBook.is_published;
      await db.from('books').update({ is_published: nextState }).eq('id', activeBook.id);
      activeBook.is_published = nextState;
      renderEditor();
    }
  });
}

function updateTitle(val) {
  if(isReadOnly) return;
  const ch = activeBook.chapters.find(c => c.id === activeChapterId);
  if(ch) { ch.title = val; debounceSave(); }
}

function handleInput() {
  if(isReadOnly) return;
  const ch = activeBook.chapters.find(c => c.id === activeChapterId);
  if(ch) { ch.contentHTML = document.getElementById('editor-body').innerHTML; debounceSave(); }
}

function debounceSave() {
  if(isReadOnly) return;
  const status = document.getElementById('save-status');
  if(status) status.textContent = 'Saving...';
  clearTimeout(saveTimer);
  saveTimer = setTimeout(saveToCloud, 500); 
}

async function saveToCloud() {
  if(isReadOnly) return; // EXTRA SAFEGUARD
  const status = document.getElementById('save-status');
  const { error } = await db.from('books').update({ chapters: activeBook.chapters }).eq('id', activeBook.id);
  if(status) status.textContent = error ? 'Save failed (Permission denied)' : 'Saved';
}

// ==========================================
// 5. UTILS
// ==========================================
function toggleSidebar() {
  sidebarHidden = !sidebarHidden;
  document.getElementById('sidebar').classList.toggle('hidden', sidebarHidden);
}

function toggleFullscreen() {
  if (!document.fullscreenElement) document.documentElement.requestFullscreen();
  else if (document.exitFullscreen) document.exitFullscreen();
}

function download(filename, text) {
  const element = document.createElement('a');
  element.setAttribute('href', 'data:text/plain;charset=utf-8,' + encodeURIComponent(text));
  element.setAttribute('download', filename);
  element.style.display = 'none'; document.body.appendChild(element);
  element.click(); document.body.removeChild(element);
}

function exportJSON() {
  download(`${activeBook.title}-backup.json`, JSON.stringify(activeBook, null, 2));
}

function exportPDF() {
  const chaptersHTML = activeBook.chapters.sort((a,b)=>a.position-b.position).map(c => `
    <div style="page-break-before: always;">
      <h2>${c.title || 'Untitled'}</h2>
      <div>${c.contentHTML}</div>
    </div>
  `).join('');

  const html = `
    <html><head><title>${activeBook.title}</title>
    <style>body { font-family: 'Merriweather', serif; padding: 40px; max-width: 800px; margin: 0 auto; line-height: 1.8; color: #000; } h1 { text-align: center; font-size: 3rem; margin-bottom: 60px; } h2 { font-size: 2rem; margin-bottom: 24px; border-bottom: 1px solid #ccc; padding-bottom: 8px; } blockquote { border-left: 3px solid #ccc; padding-left: 16px; font-style: italic; color: #555; }</style></head><body>
      <h1>${activeBook.title}</h1>${chaptersHTML}
    </body></html>
  `;
  download(`${activeBook.title}-print.html`, html);
}

function importJSON(event) {
  if(isReadOnly) return;
  const file = event.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = async (e) => {
    try {
      const data = JSON.parse(e.target.result);
      if (!data.chapters) throw new Error("Invalid backup file");
      await db.from('books').update({ chapters: data.chapters }).eq('id', activeBook.id);
      activeBook.chapters = data.chapters;
      activeChapterId = data.chapters[0]?.id;
      renderEditor();
      showModal({title: 'Success', desc: 'Backup imported successfully!', okText: 'OK'});
    } catch(err) { showModal({title: 'Error', desc: err.message, okText: 'OK'}); }
  };
  reader.readAsText(file);
}
</script>
</body>
</html>
